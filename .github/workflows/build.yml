name: Auto Build Worker

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'build.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build _worker.js
        run: node build.js

      - name: Commit and push if _worker.js changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          if git diff --staged --quiet; then
            echo "No changes in _worker.js"
          else
            git commit -m "chore(build): auto-update _worker.js by GitHub Actions"
            git push
          fi
